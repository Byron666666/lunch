<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>轉盤</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1f23;
      --muted: #667085;
      --line: #d9dee7;
      --panel: #ffffff;
      --paper: #f6f7f3;
      --accent: #e64f2e;
      --accent-strong: #b9341f;
      --green: #0f7b63;
      --shadow: 0 18px 45px rgba(30, 39, 50, 0.14);
      --radius: 8px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 15%, rgba(230, 79, 46, 0.13), transparent 26rem),
        linear-gradient(135deg, #f7f3ea 0%, #edf4ef 48%, #f6f7f3 100%);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 30rem;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .today {
      min-width: 168px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.78);
      text-align: right;
      box-shadow: 0 10px 24px rgba(30, 39, 50, 0.08);
    }

    .today strong {
      display: block;
      font-size: 1.05rem;
    }

    .today span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 1.05fr) minmax(310px, 0.95fr);
      gap: 24px;
      align-items: start;
    }

    .stage,
    .control-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 640px;
      padding: 28px;
      overflow: hidden;
    }

    .wheel-wrap {
      position: relative;
      width: min(100%, 520px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 24px 34px rgba(33, 40, 48, 0.18));
      transform: rotate(0deg);
      transition: transform 4.8s cubic-bezier(0.12, 0.74, 0.12, 1);
    }

    .pointer {
      position: absolute;
      top: -7px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 34px solid var(--accent);
      z-index: 3;
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.16));
    }

    .hub {
      position: absolute;
      width: min(36%, 178px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 10px solid #ffffff;
      border-radius: 50%;
      background: linear-gradient(150deg, #fff 0%, #f1f2ec 100%);
      box-shadow: inset 0 0 0 1px var(--line), 0 10px 22px rgba(0, 0, 0, 0.16);
      text-align: center;
      z-index: 2;
    }

    .hub button {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--accent-strong);
      font-weight: 900;
      font-size: clamp(1.2rem, 3.2vw, 2rem);
      cursor: pointer;
    }

    .hub button:disabled {
      cursor: wait;
      color: #888;
    }

    .result {
      width: min(100%, 520px);
      margin-top: 24px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      text-align: center;
    }

    .result .label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .result .choice {
      min-height: 2.8rem;
      margin-top: 5px;
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      font-weight: 900;
      color: var(--green);
      overflow-wrap: anywhere;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(15, 123, 99, 0.28);
      border-radius: var(--radius);
      background: var(--green);
      color: #fff;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .map-link:hover {
      background: #0b664f;
    }

    .control-panel {
      padding: 20px;
    }

    .panel-section + .panel-section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="text"] {
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(15, 123, 99, 0.16);
    }

    .btn {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn.secondary {
      border-color: var(--line);
      background: #fff;
      color: var(--ink);
    }

    .btn.warn {
      border-color: rgba(230, 79, 46, 0.38);
      background: #fff;
      color: var(--accent-strong);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .choices {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      max-height: 290px;
      overflow: auto;
      padding-right: 4px;
    }

    .choice-row {
      display: grid;
      grid-template-columns: 1fr 38px;
      gap: 8px;
      align-items: center;
      min-height: 42px;
      padding: 7px 7px 7px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .choice-row span {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafb;
      color: #9a2717;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .switch input {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }

    .history {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
    }

    .history li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eceff3;
    }

    .history b {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--muted);
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 16px);
      max-width: min(92vw, 420px);
      padding: 12px 16px;
      border-radius: var(--radius);
      background: #1f2933;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 880px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .today {
        width: 100%;
        text-align: left;
      }

      main {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: auto;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding: 16px 0;
      }

      .stage,
      .control-panel {
        padding: 14px;
      }

      .add-row {
        grid-template-columns: 1fr;
      }

      .tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>轉盤</h1>
        <p class="subtitle">選一份清單，讓轉盤幫你決定。Google 登入後可跨裝置同步。</p>
      </div>
      <div class="today">
        <strong id="dateText">今天</strong>
        <span id="choiceCount">0 個選項</span>
      </div>
    </header>

    <section class="lists-panel" style="padding:20px;background:white;border:1px solid #d9dee7;border-radius:8px;margin-bottom:24px" aria-label="我的清單與帳號">
      <div class="tools"><button class="btn" id="login">Google 登入</button><span id="accountName"></span><button class="btn secondary" id="logout" hidden>登出</button><span id="syncStatus" role="status">本機儲存</span></div>
      <label for="listSelect" style="display:block;margin:16px 0 8px">我的清單</label>
      <select id="listSelect" style="width:100%;padding:12px;font:inherit;margin-bottom:12px" aria-label="切換輪盤清單"></select>
      <form id="listForm" class="add-row"><input id="listName" type="text" maxlength="40" required placeholder="新清單名稱，例如：週末活動" aria-label="新清單名稱"><button class="btn" id="createListBtn">新增清單</button></form>
    </section>
    <main>
      <section class="stage" aria-label="轉盤區">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="900" height="900" aria-label="可旋轉的轉盤"></canvas>
          <div class="hub">
            <button id="spinBtn" type="button">開始</button>
          </div>
        </div>
        <div class="result" aria-live="polite">
          <div class="label">抽選結果</div>
          <div class="choice" id="resultText">先轉一下</div>
          <div class="result-actions">
            <a class="map-link" id="mapLink" href="https://www.google.com/maps" target="_blank" rel="noopener">Google 地圖搜尋</a>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="輪盤設定">
        <section class="panel-section">
          <h2 id="currentListTitle">清單選項</h2>
          <form class="add-row" id="addForm">
            <input aria-label="新增選項" id="newChoice" type="text" placeholder="輸入新的選項" maxlength="24" autocomplete="off">
            <button class="btn" type="submit">新增</button>
          </form>
          <label class="switch">
            <input id="avoidRepeat" type="checkbox" checked>
            <span>盡量不要連續抽到同一個</span>
          </label>
          <div class="choices" id="choiceList"></div>
        </section>

        <section class="panel-section">
          <h2>快速操作</h2>
          <div class="tools">
            <button class="btn secondary" id="shuffleBtn" type="button">打亂順序</button>
            <button class="btn secondary" id="sampleBtn" type="button">補回預設</button>
            <button class="btn secondary" id="exportBtn" type="button">匯出 JSON</button>
            <button class="btn secondary" id="importBtn" type="button">匯入 JSON</button>
            <button class="btn warn" id="clearHistoryBtn" type="button">清紀錄</button>
            <button class="btn warn" id="resetBtn" type="button">重設目前清單</button>
          </div>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </section>

        <section class="panel-section">
          <h2>最近結果</h2>
          <ul class="history" id="historyList"></ul>
          <p class="empty" id="emptyHistory">還沒有紀錄。</p>
        </section>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script>(() => {
  "use strict";

  const isObject = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
  const owns = (value, key) => Object.prototype.hasOwnProperty.call(value, key);
  const safeKey = (key) => !["__proto__", "constructor", "prototype"].includes(key);
  const copy = (value) => JSON.parse(JSON.stringify(value));
  const canonical = (value) => JSON.stringify(value, function (_key, item) {
    return isObject(item)
      ? Object.fromEntries(Object.keys(item).filter(safeKey).sort().map((key) => [key, item[key]]))
      : item;
  });
  const equal = (left, right) => canonical(left) === canonical(right);

  // Record only the fields the learner changed. Absence is an explicit deletion,
  // so moving a learned word back to "new" is also synchronized.
  function differences(before, after, path = [], result = []) {
    for (const key of new Set([...Object.keys(before || {}), ...Object.keys(after || {})])) {
      if (!safeKey(key)) continue;
      const nextPath = [...path, key];
      if (!owns(after || {}, key)) result.push({ path: nextPath, remove: true });
      else if (isObject(after[key]) && (isObject(before?.[key]) || before?.[key] === undefined)) {
        differences(before?.[key] || {}, after[key], nextPath, result);
      } else if (!equal(before?.[key], after[key])) {
        result.push({ path: nextPath, value: copy(after[key]) });
      }
    }
    return result;
  }

  function applyOperations(state, operations) {
    const next = copy(state);
    for (const operation of [...operations].sort((a, b) => a.sequence - b.sequence)) {
      const path = operation.path;
      if (!Array.isArray(path) || !path.length || !path.every((key) => typeof key === "string" && safeKey(key))) continue;
      let target = next;
      for (const key of path.slice(0, -1)) {
        if (!isObject(target[key])) target[key] = {};
        target = target[key];
      }
      const key = path[path.length - 1];
      if (operation.remove) delete target[key];
      else target[key] = copy(operation.value);
    }
    return next;
  }

  function addMissing(server, local) {
    const merged = copy(server);
    for (const [key, value] of Object.entries(local || {})) {
      if (!safeKey(key)) continue;
      if (!owns(merged, key)) merged[key] = copy(value);
      else if (isObject(merged[key]) && isObject(value)) merged[key] = addMissing(merged[key], value);
    }
    return merged;
  }

  function create(options) {
    const { db, getDocument, storagePrefix, readLocal, applyLocal, fromCloud, toCloud, setStatus } = options;
    const writer = window.crypto?.randomUUID?.() || `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    const prefix = `${storagePrefix}.sync.v2`;
    const ownerKey = `${prefix}.owner`;
    let storageFailed = false;
    let user = null;
    let generation = 0;
    let unsubscribe = null;
    let timer = 0;
    let retryDelay = 2000;
    let flight = null;
    let ready = false;
    let exists = false;
    let base = null;
    let receipts = {};
    let serverRevision = 0;
    let applying = false;
    let observed = copy(readLocal());

    function read(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch { return fallback; }
    }
    function write(key, value) {
      try {
        if (value === null) localStorage.removeItem(key);
        else localStorage.setItem(key, JSON.stringify(value));
        storageFailed = false;
      } catch {
        storageFailed = true;
        setStatus("瀏覽器無法保留待同步紀錄，請保持此頁開啟", "error");
      }
    }

    let owner = read(ownerKey, null);
    let queueOwner = owner || "guest";
    const makeQueue = (seed = null) => ({ writer, sequence: seed ? 1 : 0, seed, operations: {} });
    let queue = makeQueue(owner ? null : copy(observed));
    const queuePrefix = (uid = queueOwner) => `${prefix}.queue.${encodeURIComponent(uid)}.`;
    const queueKey = () => `${queuePrefix()}${writer}`;
    const cacheKey = (uid = queueOwner) => `${prefix}.base.${encodeURIComponent(uid)}`;

    function persistQueue() {
      write(queueKey(), queue.seed || Object.keys(queue.operations).length ? queue : null);
    }

    // Each tab owns a separate outbox. A reopened page can recover other
    // outboxes without overwriting a still-open tab's newer changes.
    function readQueues() {
      const queues = new Map();
      try {
        const keys = Array.from({ length: localStorage.length }, (_, index) => localStorage.key(index));
        for (const key of keys) {
          if (!key?.startsWith(queuePrefix())) continue;
          const item = read(key, null);
          if (item && typeof item.writer === "string" && isObject(item.operations)) queues.set(item.writer, item);
        }
      } catch { /* The in-memory outbox can still be uploaded. */ }
      queues.set(writer, queue);
      return [...queues.values()].sort((a, b) => (a.writer === writer ? 1 : b.writer === writer ? -1 : a.writer.localeCompare(b.writer)));
    }

    function outstanding(all = readQueues(), acknowledgements = receipts) {
      return all.map((item) => {
        const acknowledged = Number(acknowledgements[item.writer] || 0);
        return {
          writer: item.writer,
          sequence: Number(item.sequence || 0),
          seed: acknowledged < 1 ? item.seed : null,
          operations: Object.values(item.operations).filter((operation) => Number(operation.sequence) > acknowledged),
        };
      }).filter((item) => item.seed || item.operations.length);
    }

    function compose(state, batches) {
      let next = copy(state);
      for (const batch of batches) {
        if (batch.seed) next = addMissing(next, batch.seed);
        next = applyOperations(next, batch.operations);
      }
      return next;
    }

    function display() {
      if (base === null) return;
      const next = compose(base, outstanding());
      if (!equal(readLocal(), next)) {
        applying = true;
        try { applyLocal(copy(next)); }
        finally { applying = false; }
      }
      // Adapters may fill in defaults while rendering. Those are not edits.
      observed = copy(readLocal());
    }

    function report() {
      if (!user) return;
      if (storageFailed && outstanding().length) {
        setStatus("瀏覽器無法保留待同步紀錄，請保持此頁開啟", "error");
      } else if (navigator.onLine === false) {
        setStatus(outstanding().length ? "已存本機，連線後自動同步" : "離線，顯示本機進度", "pending");
      } else if (!ready) {
        setStatus("正在確認雲端進度…", "syncing");
      } else if (flight) {
        setStatus("正在儲存至雲端…", "syncing");
      } else if (outstanding().length || !exists) {
        setStatus("已存本機，等待雲端同步…", "pending");
      } else {
        setStatus("已同步至雲端", "synced");
      }
    }

    function schedule(delay = 250) {
      if (!user || timer) return;
      const token = generation;
      timer = window.setTimeout(() => {
        timer = 0;
        if (token !== generation) return;
        if (!unsubscribe) listen();
        void flush();
      }, delay);
    }

    function changed() {
      if (applying) return;
      const next = copy(readLocal());
      // Once an account has signed out, keep the cleared local view isolated
      // from that account's outbox. A later sign-in will load the selected
      // account's cache or confirmed cloud state.
      if (!user && owner) {
        observed = next;
        return;
      }
      const changes = differences(observed, next);
      observed = next;
      if (!changes.length) return;
      for (const operation of changes) {
        operation.sequence = ++queue.sequence;
        queue.operations[JSON.stringify(operation.path)] = operation;
      }
      persistQueue();
      report();
      schedule();
    }

    function saveBase() {
      write(cacheKey(), { state: base, receipts, revision: serverRevision, exists });
    }

    function pruneAcknowledged() {
      const acknowledged = Number(receipts[writer] || 0);
      if (acknowledged >= 1) queue.seed = null;
      for (const [key, operation] of Object.entries(queue.operations)) {
        if (operation.sequence <= acknowledged) delete queue.operations[key];
      }
      persistQueue();
    }

    function receive(snapshot, token) {
      if (token !== generation || !user) return;
      if (snapshot.metadata?.fromCache || snapshot.metadata?.hasPendingWrites) {
        if (snapshot.metadata?.fromCache) ready = false;
        report();
        return;
      }
      try {
        const data = snapshot.exists ? snapshot.data() || {} : {};
        const incomingRevision = Number(data.syncRevision || 0);
        // A transaction acknowledgement can arrive before its listener event.
        if (incomingRevision > 0 && incomingRevision < serverRevision) return;
        base = fromCloud(data);
        receipts = isObject(data.syncWriters) ? data.syncWriters : {};
        serverRevision = incomingRevision;
        exists = snapshot.exists;
        ready = true;
        retryDelay = 2000;
        pruneAcknowledged();
        saveBase();
        display();
        report();
        if (outstanding().length || !exists) schedule();
      } catch (error) { failed(error, token, true); }
    }

    function failed(error, token, listenerFailure = false) {
      if (token !== generation) return;
      console.warn("FlipWords cloud synchronization will retry.", error);
      if (listenerFailure) {
        ready = false;
        unsubscribe?.();
        unsubscribe = null;
      }
      const message = options.describeError?.(error) || "雲端同步暫時失敗";

    function listen() {

      const token = generation;
      try {
        unsubscribe = getDocument(user).onSnapshot(
          { includeMetadataChanges: true },
          (snapshot) => receive(snapshot, token),
          (error) => failed(error, token, true),
        );
      } catch (error) { failed(error, token, true); }

    async function drain(token, documentReference) {
      while (token === generation && ready && navigator.onLine !== false) {
        const batches = copy(outstanding());
        if (!batches.length && exists) return true;

          // Firestore retries this callback if another device writes meanwhile.
          // Never read mutable UI state inside the retryable callback.

            ...batch,

            operations: batch.operations.filter((operation) => operation.sequence > Number(remoteReceipts[batch.writer] || 0)),

          }

            ...previous,

          base = result.state;
          receipts = result.receipts;
          serverRevision = result.revision;

        exists = true;
        pruneAcknowledged();
        saveBase();
        display();

        // Continue until those newer edits have also been acknowledged.

    function flush() {
      window.clearTimeout(timer);
      timer = 0;
      if (flight) return flight;
      if (!user || !ready || navigator.onLine === false) {
        report();
        return Promise.resolve(false);
      }
      const token = generation;
      const documentReference = getDocument(user);
      flight = drain(token, documentReference).then((complete) => {

    function start(nextUser) {
      if (user?.uid && user.uid === nextUser?.uid) return;
      const previousAccountId = user?.uid || owner || null;
      const leavingAccount = Boolean(previousAccountId && !nextUser);
      const switchingAccount = Boolean(previousAccountId && nextUser?.uid
        && previousAccountId !== nextUser.uid);
      generation += 1;
      unsubscribe?.();
      unsubscribe = null;
      window.clearTimeout(timer);
      timer = 0;
      flight = null;
      ready = false;
      exists = false;
      user = nextUser;

        applying = true;
        try { applyLocal(copy(fromCloud({}))); }
        finally { applying = false; }
        observed = copy(readLocal());
      }

      if (!user) {
        if (leavingAccount) initializeLocalState();
        return;
      }

      if (queueOwner !== user.uid) {
        persistQueue();
        const guest = !owner && queueOwner === "guest";
        const guestQueues = guest ? readQueues() : [];
        const previousGuestKey = queueKey();
        queueOwner = user.uid;
        if (!guest) {
          const savedQueue = read(queueKey(), null);
          queue = savedQueue?.writer === writer && isObject(savedQueue.operations) ? savedQueue : makeQueue();
        } else {
          const backupKey = `${prefix}.legacy-backup.${encodeURIComponent(user.uid)}`;
          if (read(backupKey, null) === null) write(backupKey, copy(readLocal()));
          for (const recovered of guestQueues) {
            if (recovered.writer !== writer) write(`${queuePrefix()}${recovered.writer}`, recovered);
          }
        }
        persistQueue();
        if (guest) write(previousGuestKey, null);
      }
      owner = user.uid;
      write(ownerKey, owner);
      if (switchingAccount) initializeLocalState();
      const cached = read(cacheKey(), null);
      base = cached?.state || null;
      receipts = cached?.receipts || {};
      serverRevision = Number(cached?.revision || 0);
      if (base !== null) display();
      report();
      listen();
    }

    function resume() {
      if (!user) return;
      if (!unsubscribe) listen();
      void flush();
    }
    window.addEventListener("online", resume);
    window.addEventListener("offline", report);
    window.addEventListener("focus", resume);
    window.addEventListener("pagehide", () => { void flush(); });
    document.addEventListener("visibilitychange", resume);
    window.addEventListener("storage", (event) => {
      if (!user || !event.key?.startsWith(queuePrefix())) return;
      display();
      report();
      schedule();

    return { start, changed, flush };
  }

  window.FlipWordsCloudSync = { create };

  <script>
    const defaults = ["牛肉麵", "滷肉飯", "便當", "水餃", "咖哩飯", "拉麵", "義大利麵", "雞肉飯", "鍋燒意麵", "健康餐"];

    function drawWheel() {
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 18;
      ctx.clearRect(0, 0, size, size);

      ctx.save();
      ctx.translate(center, center);

      if (choices.length === 0) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#eef1f4";
        ctx.fill();
        ctx.fillStyle = "#667085";
        ctx.font = "700 40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("請新增選項", 0, 0);
        ctx.restore();
        return;
      }

      const segment = (Math.PI * 2) / choices.length;
      choices.forEach((choice, index) => {
        const start = -Math.PI / 2 + index * segment;
        const end = start + segment;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = palette[index % palette.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.78)";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + segment / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = `${choices.length > 8 ? 28 : 34}px sans-serif`;
        ctx.shadowColor = "rgba(0,0,0,0.22)";
        ctx.shadowBlur = 3;
        const label = choice.length > 8 ? `${choice.slice(0, 8)}...` : choice;
        ctx.fillText(label, radius - 44, 0, radius * 0.56);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.lineWidth = 16;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.restore();
    }

    function renderChoices() {
      choiceList.innerHTML = "";
      choices.forEach((choice, index) => {

        row.className = "choice-row";

        const label = document.createElement("span");
        label.textContent = choice;

    function renderHistory() {

    function saveAndRender() {
      saveState();

      renderHistory();

    function pickIndex() {
      if (choices.length === 1) return 0;
      const last = history[0]?.choice;
      let index = Math.floor(Math.random() * choices.length);
      if (avoidRepeat.checked && last && choices.length > 1) {
        let guard = 0;
        while (choices[index] === last && guard < 12) {
          index = Math.floor(Math.random() * choices.length);
          guard += 1;
        }
      }
      return index;
    }

    function spin() {
      if (spinning || choices.length < 2) {
        showToast(choices.length < 2 ? "至少需要 2 個選項。" : "輪盤還在轉。");
        return;
      }

      spinBtn.disabled = true;
      spinBtn.textContent = "轉動";
      resultText.textContent = "決定中...";

      const index = pickIndex();
      const segment = 360 / choices.length;
      const targetCenter = index * segment + segment / 2;
      const currentAngle = ((currentRotation % 360) + 360) % 360;
      const targetAngle = (360 - targetCenter) % 360;
      const correction = (targetAngle - currentAngle + 360) % 360;
      const finalRotation = 360 * (5 + Math.floor(Math.random() * 3)) + correction;
      currentRotation += finalRotation;

    const listsKey = "soul-wheel.lists.v2";

        accountGeneration++;
        login.hidden = Boolean(user); logout.hidden = !user;
        document.querySelector("#accountName").textContent = user?.displayName || user?.email || "";
        cloudSync.start(user);
        if (!user) status("本機儲存・Google 登入後同步清單");
      });
    }
    window.addEventListener("load", startCloud);

    addForm.addEventListener("submit", event => {
      event.preventDefault();
      const value = newChoice.value.trim();
      if (!value) return;
      if (choices.includes(value)) {
        showToast("這個選項已經在輪盤裡。");
        return;
      }
      choices.push(value);
      newChoice.value = "";
      saveAndRender();
      showToast("已新增選項");
    });

    avoidRepeat.addEventListener("change", saveState);

    document.querySelector("#shuffleBtn").addEventListener("click", () => {
      choices = choices
        .map(value => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(item => item.value);
      saveAndRender();
      showToast("已打亂順序");
    });

    document.querySelector("#sampleBtn").addEventListener("click", () => {
      defaults.forEach(item => {
        if (!choices.includes(item)) choices.push(item);
      });
      saveAndRender();
      showToast("已補回預設選項");
    });

    document.querySelector("#exportBtn").addEventListener("click", downloadJson);

    document.querySelector("#importBtn").addEventListener("click", () => {
      importFile.click();
    });

    importFile.addEventListener("change", () => {
      importJsonFile(importFile.files[0]);
    });

    document.querySelector("#clearHistoryBtn").addEventListener("click", () => {
      history = [];
      selectedChoice = "";
      resultText.textContent = "先轉一下";
      saveAndRender();
      showToast("已清除最近結果");
    });

    document.querySelector("#resetBtn").addEventListener("click", () => {
      if (!confirm("重設目前清單的選項與抽選紀錄？其他清單不受影響。")) return;
      choices = [];
      history = [];
      selectedChoice = "";
      avoidRepeat.checked = true;
      resultText.textContent = "先轉一下";
      currentRotation = 0;
      canvas.style.transform = "rotate(0deg)";
      saveAndRender();
      showToast("已重設目前清單");
    });

    spinBtn.addEventListener("click", spin);

    dateText.textContent = new Intl.DateTimeFormat("zh-TW", {
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());

    loadState();
    if (selectedChoice) resultText.textContent = selectedChoice;
    saveAndRender();
  </script>
</body>
</html>
