<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>午餐輪盤</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1f23;
      --muted: #667085;
      --line: #d9dee7;
      --panel: #ffffff;
      --paper: #f6f7f3;
      --accent: #e64f2e;
      --accent-strong: #b9341f;
      --green: #0f7b63;
      --shadow: 0 18px 45px rgba(30, 39, 50, 0.14);
      --radius: 8px;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 15%, rgba(230, 79, 46, 0.13), transparent 26rem),
        linear-gradient(135deg, #f7f3ea 0%, #edf4ef 48%, #f6f7f3 100%);
    }

    button,
    input {
      font: inherit;
    }

    .app {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4.4rem);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 30rem;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .today {
      min-width: 168px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.78);
      text-align: right;
      box-shadow: 0 10px 24px rgba(30, 39, 50, 0.08);
    }

    .today strong {
      display: block;
      font-size: 1.05rem;
    }

    .today span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 1.05fr) minmax(310px, 0.95fr);
      gap: 24px;
      align-items: start;
    }

    .stage,
    .control-panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
      box-shadow: var(--shadow);
    }

    .stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 640px;
      padding: 28px;
      overflow: hidden;
    }

    .wheel-wrap {
      position: relative;
      width: min(92vw, 520px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 24px 34px rgba(33, 40, 48, 0.18));
      transform: rotate(0deg);
      transition: transform 4.8s cubic-bezier(0.12, 0.74, 0.12, 1);
    }

    .pointer {
      position: absolute;
      top: -7px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-left: 18px solid transparent;
      border-right: 18px solid transparent;
      border-top: 34px solid var(--accent);
      z-index: 3;
      filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.16));
    }

    .hub {
      position: absolute;
      width: min(36%, 178px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 10px solid #ffffff;
      border-radius: 50%;
      background: linear-gradient(150deg, #fff 0%, #f1f2ec 100%);
      box-shadow: inset 0 0 0 1px var(--line), 0 10px 22px rgba(0, 0, 0, 0.16);
      text-align: center;
      z-index: 2;
    }

    .hub button {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--accent-strong);
      font-weight: 900;
      font-size: clamp(1.2rem, 3.2vw, 2rem);
      cursor: pointer;
    }

    .hub button:disabled {
      cursor: wait;
      color: #888;
    }

    .result {
      width: min(100%, 520px);
      margin-top: 24px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      text-align: center;
    }

    .result .label {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .result .choice {
      min-height: 2.8rem;
      margin-top: 5px;
      font-size: clamp(1.55rem, 4vw, 2.35rem);
      font-weight: 900;
      color: var(--green);
      overflow-wrap: anywhere;
    }

    .result-actions {
      display: flex;
      justify-content: center;
      margin-top: 14px;
    }

    .map-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid rgba(15, 123, 99, 0.28);
      border-radius: var(--radius);
      background: var(--green);
      color: #fff;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
    }

    .map-link:hover {
      background: #0b664f;
    }

    .control-panel {
      padding: 20px;
    }

    .panel-section + .panel-section {
      margin-top: 24px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.05rem;
      letter-spacing: 0;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    input[type="text"] {
      min-width: 0;
      height: 44px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(15, 123, 99, 0.16);
    }

    .btn {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn.secondary {
      border-color: var(--line);
      background: #fff;
      color: var(--ink);
    }

    .btn.warn {
      border-color: rgba(230, 79, 46, 0.38);
      background: #fff;
      color: var(--accent-strong);
    }

    .btn:disabled {
      cursor: not-allowed;
      opacity: 0.58;
    }

    .choices {
      display: grid;
      gap: 8px;
      margin-top: 14px;
      max-height: 290px;
      overflow: auto;
      padding-right: 4px;
    }

    .choice-row {
      display: grid;
      grid-template-columns: 1fr 38px;
      gap: 8px;
      align-items: center;
      min-height: 42px;
      padding: 7px 7px 7px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
    }

    .choice-row span {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .icon-btn {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #f8fafb;
      color: #9a2717;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
    }

    .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .switch input {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
    }

    .history {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      color: var(--muted);
    }

    .history li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eceff3;
    }

    .history b {
      color: var(--ink);
      overflow-wrap: anywhere;
    }

    .empty {
      color: var(--muted);
      line-height: 1.7;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 16px);
      max-width: min(92vw, 420px);
      padding: 12px 16px;
      border-radius: var(--radius);
      background: #1f2933;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 880px) {
      header {
        align-items: start;
        flex-direction: column;
      }

      .today {
        width: 100%;
        text-align: left;
      }

      main {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: auto;
      }
    }

    @media (max-width: 560px) {
      .app {
        width: min(100vw - 20px, 1180px);
        padding: 16px 0;
      }

      .stage,
      .control-panel {
        padding: 14px;
      }

      .add-row {
        grid-template-columns: 1fr;
      }

      .tools {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>午餐輪盤</h1>
        <p class="subtitle">把想吃的店或餐點丟進來，按中間開始轉。選項會自動存在這台電腦的瀏覽器裡。</p>
      </div>
      <div class="today">
        <strong id="dateText">今天午餐</strong>
        <span id="choiceCount">0 個選項</span>
      </div>
    </header>

    <main>
      <section class="stage" aria-label="午餐輪盤區">
        <div class="wheel-wrap">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="900" height="900" aria-label="可旋轉的午餐輪盤"></canvas>
          <div class="hub">
            <button id="spinBtn" type="button">開始</button>
          </div>
        </div>
        <div class="result" aria-live="polite">
          <div class="label">今天吃</div>
          <div class="choice" id="resultText">先轉一下</div>
          <div class="result-actions">
            <a class="map-link" id="mapLink" href="https://www.google.com/maps/search/?api=1&query=%E9%99%84%E8%BF%91%20%E5%8D%88%E9%A4%90" target="_blank" rel="noopener">Google 地圖搜尋</a>
          </div>
        </div>
      </section>

      <aside class="control-panel" aria-label="輪盤設定">
        <section class="panel-section">
          <h2>午餐選項</h2>
          <form class="add-row" id="addForm">
            <input id="newChoice" type="text" placeholder="例如：牛肉麵、便當、咖哩飯" maxlength="24" autocomplete="off">
            <button class="btn" type="submit">新增</button>
          </form>
          <label class="switch">
            <input id="avoidRepeat" type="checkbox" checked>
            <span>盡量不要連續抽到同一個</span>
          </label>
          <div class="choices" id="choiceList"></div>
        </section>

        <section class="panel-section">
          <h2>快速操作</h2>
          <div class="tools">
            <button class="btn secondary" id="shuffleBtn" type="button">打亂順序</button>
            <button class="btn secondary" id="sampleBtn" type="button">補回預設</button>
            <button class="btn secondary" id="exportBtn" type="button">匯出 JSON</button>
            <button class="btn secondary" id="importBtn" type="button">匯入 JSON</button>
            <button class="btn warn" id="clearHistoryBtn" type="button">清紀錄</button>
            <button class="btn warn" id="resetBtn" type="button">全部重設</button>
          </div>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </section>

        <section class="panel-section">
          <h2>最近結果</h2>
          <ul class="history" id="historyList"></ul>
          <p class="empty" id="emptyHistory">還沒有紀錄。</p>
        </section>
      </aside>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const defaults = ["牛肉麵", "滷肉飯", "便當", "水餃", "咖哩飯", "拉麵", "義大利麵", "雞肉飯", "鍋燒意麵", "健康餐"];
    const palette = ["#e64f2e", "#f2b705", "#0f7b63", "#2f6f9f", "#f08a4b", "#7a5cff", "#d13f64", "#4b9f47", "#284b63", "#ef6f6c"];
    const stateKey = "lunch-roulette-state-v1";
    const historyLimit = 100;
    const visibleHistoryCount = 8;
    const canvas = document.querySelector("#wheel");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.querySelector("#spinBtn");
    const resultText = document.querySelector("#resultText");
    const mapLink = document.querySelector("#mapLink");
    const choiceList = document.querySelector("#choiceList");
    const choiceCount = document.querySelector("#choiceCount");
    const addForm = document.querySelector("#addForm");
    const newChoice = document.querySelector("#newChoice");
    const avoidRepeat = document.querySelector("#avoidRepeat");
    const historyList = document.querySelector("#historyList");
    const emptyHistory = document.querySelector("#emptyHistory");
    const toast = document.querySelector("#toast");
    const dateText = document.querySelector("#dateText");
    const importFile = document.querySelector("#importFile");

    let choices = [];
    let history = [];
    let currentRotation = 0;
    let spinning = false;
    let toastTimer = 0;
    let selectedChoice = "";

    function normalizeHistoryItem(item) {
      if (typeof item === "string") {
        return {
          choice: item,
          time: "",
          timestamp: ""
        };
      }
      if (!item || typeof item !== "object") return null;
      const choice = String(item.choice || "").trim();
      if (!choice) return null;
      return {
        choice,
        time: String(item.time || ""),
        timestamp: String(item.timestamp || "")
      };
    }

    function cleanChoices(items) {
      if (!Array.isArray(items)) return [];
      return [...new Set(items.map(item => String(item).trim()).filter(Boolean))];
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(stateKey));
        if (saved && Array.isArray(saved.choices)) {
          choices = cleanChoices(saved.choices);
          history = Array.isArray(saved.history)
            ? saved.history.map(normalizeHistoryItem).filter(Boolean).slice(0, historyLimit)
            : [];
          avoidRepeat.checked = saved.avoidRepeat !== false;
          selectedChoice = String(saved.selectedChoice || "");
        }
      } catch (error) {
        choices = [];
        history = [];
      }
      if (choices.length === 0) choices = [...defaults];
      selectedChoice = selectedChoice || history[0]?.choice || "";
    }

    function saveState() {
      localStorage.setItem(stateKey, JSON.stringify({
        version: 1,
        choices,
        history,
        avoidRepeat: avoidRepeat.checked,
        selectedChoice
      }));
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function updateMapLink() {
      const query = selectedChoice ? `附近 ${selectedChoice}` : "附近 午餐";
      mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
      mapLink.setAttribute("aria-label", `在 Google 地圖搜尋${query}`);
    }

    function downloadJson() {
      const payload = {
        app: "lunch-roulette",
        version: 1,
        exportedAt: new Date().toISOString(),
        choices,
        history,
        avoidRepeat: avoidRepeat.checked,
        selectedChoice
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      const date = new Date().toISOString().slice(0, 10);
      link.href = url;
      link.download = `lunch-roulette-${date}.json`;
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      showToast("已下載 JSON 備份");
    }

    function importJsonFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const imported = JSON.parse(reader.result);
          const nextChoices = cleanChoices(imported.choices);
          const nextHistory = Array.isArray(imported.history)
            ? imported.history.map(normalizeHistoryItem).filter(Boolean).slice(0, historyLimit)
            : [];

          if (nextChoices.length < 2) {
            showToast("JSON 至少需要 2 個午餐選項。");
            return;
          }

          const shouldImport = window.confirm("匯入 JSON 會取代目前選項與紀錄，確定要匯入嗎？");
          if (!shouldImport) return;

          choices = nextChoices;
          history = nextHistory;
          selectedChoice = String(imported.selectedChoice || history[0]?.choice || "");
          avoidRepeat.checked = imported.avoidRepeat !== false;
          resultText.textContent = selectedChoice || "先轉一下";
          saveAndRender();
          showToast("已匯入 JSON 備份");
        } catch (error) {
          showToast("JSON 格式無法讀取。");
        } finally {
          importFile.value = "";
        }
      });
      reader.readAsText(file);
    }

    function drawWheel() {
      const size = canvas.width;
      const center = size / 2;
      const radius = center - 18;
      ctx.clearRect(0, 0, size, size);

      ctx.save();
      ctx.translate(center, center);

      if (choices.length === 0) {
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fillStyle = "#eef1f4";
        ctx.fill();
        ctx.fillStyle = "#667085";
        ctx.font = "700 40px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("請新增選項", 0, 0);
        ctx.restore();
        return;
      }

      const segment = (Math.PI * 2) / choices.length;
      choices.forEach((choice, index) => {
        const start = -Math.PI / 2 + index * segment;
        const end = start + segment;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = palette[index % palette.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.78)";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + segment / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = `${choices.length > 8 ? 28 : 34}px sans-serif`;
        ctx.shadowColor = "rgba(0,0,0,0.22)";
        ctx.shadowBlur = 3;
        const label = choice.length > 8 ? `${choice.slice(0, 8)}...` : choice;
        ctx.fillText(label, radius - 44, 0, radius * 0.56);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.lineWidth = 16;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();
      ctx.restore();
    }

    function renderChoices() {
      choiceList.innerHTML = "";
      choices.forEach((choice, index) => {
        const row = document.createElement("div");
        row.className = "choice-row";

        const label = document.createElement("span");
        label.textContent = choice;

        const remove = document.createElement("button");
        remove.className = "icon-btn";
        remove.type = "button";
        remove.title = `移除 ${choice}`;
        remove.setAttribute("aria-label", `移除 ${choice}`);
        remove.textContent = "×";
        remove.addEventListener("click", () => {
          choices.splice(index, 1);
          saveAndRender();
          showToast("已移除選項");
        });

        row.append(label, remove);
        choiceList.append(row);
      });
      choiceCount.textContent = `${choices.length} 個選項`;
      spinBtn.disabled = choices.length < 2 || spinning;
    }

    function renderHistory() {
      historyList.innerHTML = "";
      emptyHistory.hidden = history.length > 0;
      history.slice(0, visibleHistoryCount).forEach(item => {
        const li = document.createElement("li");
        const name = document.createElement("b");
        const time = document.createElement("span");
        name.textContent = item.choice;
        time.textContent = item.time;
        li.append(name, time);
        historyList.append(li);
      });
    }

    function saveAndRender() {
      saveState();
      updateMapLink();
      drawWheel();
      renderChoices();
      renderHistory();
    }

    function pickIndex() {
      if (choices.length === 1) return 0;
      const last = history[0]?.choice;
      let index = Math.floor(Math.random() * choices.length);
      if (avoidRepeat.checked && last && choices.length > 1) {
        let guard = 0;
        while (choices[index] === last && guard < 12) {
          index = Math.floor(Math.random() * choices.length);
          guard += 1;
        }
      }
      return index;
    }

    function spin() {
      if (spinning || choices.length < 2) {
        showToast(choices.length < 2 ? "至少需要 2 個選項。" : "輪盤還在轉。");
        return;
      }

      spinning = true;
      spinBtn.disabled = true;
      spinBtn.textContent = "轉動";
      resultText.textContent = "決定中...";

      const index = pickIndex();
      const segment = 360 / choices.length;
      const targetCenter = index * segment + segment / 2;
      const finalRotation = 360 * (5 + Math.floor(Math.random() * 3)) + (360 - targetCenter);
      currentRotation += finalRotation;
      canvas.style.transform = `rotate(${currentRotation}deg)`;

      window.setTimeout(() => {
        const choice = choices[index];
        selectedChoice = choice;
        resultText.textContent = choice;
        history.unshift({
          choice,
          time: new Intl.DateTimeFormat("zh-TW", { hour: "2-digit", minute: "2-digit" }).format(new Date()),
          timestamp: new Date().toISOString()
        });
        history = history.slice(0, historyLimit);
        spinning = false;
        spinBtn.textContent = "再轉";
        saveAndRender();
      }, 4900);
    }

    addForm.addEventListener("submit", event => {
      event.preventDefault();
      const value = newChoice.value.trim();
      if (!value) return;
      if (choices.includes(value)) {
        showToast("這個選項已經在輪盤裡。");
        return;
      }
      choices.push(value);
      newChoice.value = "";
      saveAndRender();
      showToast("已新增選項");
    });

    avoidRepeat.addEventListener("change", saveState);

    document.querySelector("#shuffleBtn").addEventListener("click", () => {
      choices = choices
        .map(value => ({ value, sort: Math.random() }))
        .sort((a, b) => a.sort - b.sort)
        .map(item => item.value);
      saveAndRender();
      showToast("已打亂順序");
    });

    document.querySelector("#sampleBtn").addEventListener("click", () => {
      defaults.forEach(item => {
        if (!choices.includes(item)) choices.push(item);
      });
      saveAndRender();
      showToast("已補回預設選項");
    });

    document.querySelector("#exportBtn").addEventListener("click", downloadJson);

    document.querySelector("#importBtn").addEventListener("click", () => {
      importFile.click();
    });

    importFile.addEventListener("change", () => {
      importJsonFile(importFile.files[0]);
    });

    document.querySelector("#clearHistoryBtn").addEventListener("click", () => {
      history = [];
      selectedChoice = "";
      resultText.textContent = "先轉一下";
      saveAndRender();
      showToast("已清除最近結果");
    });

    document.querySelector("#resetBtn").addEventListener("click", () => {
      choices = [...defaults];
      history = [];
      selectedChoice = "";
      avoidRepeat.checked = true;
      resultText.textContent = "先轉一下";
      currentRotation = 0;
      canvas.style.transform = "rotate(0deg)";
      saveAndRender();
      showToast("已全部重設");
    });

    spinBtn.addEventListener("click", spin);

    dateText.textContent = new Intl.DateTimeFormat("zh-TW", {
      weekday: "long",
      month: "long",
      day: "numeric"
    }).format(new Date());

    loadState();
    if (selectedChoice) resultText.textContent = selectedChoice;
    saveAndRender();
  </script>
</body>
</html>
